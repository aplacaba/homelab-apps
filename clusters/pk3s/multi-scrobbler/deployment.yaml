apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-scrobbler
  namespace: multi-scrobbler
  labels:
    app: multi-scrobbler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: multi-scrobbler
  template:
    metadata:
      labels:
        app: multi-scrobbler
      annotations:
        secrets-revision: "1"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      containers:
        - name: multi-scrobbler
          image: foxxmd/multi-scrobbler:0.19.2
          ports:
            - containerPort: 9078
              name: http
          env:
            - name: TZ
              value: Asia/Manila
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: KOITO_ID
              value: koito
            - name: KOITO_URL
              value: http://koito.koito.svc:4110
            - name: KOITO_USER
              valueFrom:
                secretKeyRef:
                  name: multi-scrobbler-secrets
                  key: KOITO_USER
            - name: KOITO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: multi-scrobbler-secrets
                  key: KOITO_TOKEN
            - name: SOURCE_LZ_ID
              value: listenbrainz
            - name: SOURCE_LZ_USER
              valueFrom:
                secretKeyRef:
                  name: multi-scrobbler-secrets
                  key: SOURCE_LZ_USER
            - name: SOURCE_LZ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: multi-scrobbler-secrets
                  key: SOURCE_LZ_TOKEN
            - name: YTM_ID
              value: ytmusic
            - name: YTM_COOKIE
              valueFrom:
                secretKeyRef:
                  name: multi-scrobbler-secrets
                  key: YTM_COOKIE
          volumeMounts:
            - name: data
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: multi-scrobbler-data
