apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cv-datastar-apex
  namespace: cv-datastar
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`alacaba.org`)
      middlewares:
        - name: redirect-to-https
          namespace: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cv-datastar-apex-https
  namespace: cv-datastar
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alacaba.org`)
      services:
        - name: cv-datastar
          port: 8080
  tls:
    secretName: cv-alacaba-org-tls
