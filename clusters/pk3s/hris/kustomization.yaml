apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - certificate.yaml
  - ingressroute.yaml
  - ingressroute-https.yaml
  - sealedsecret-rails-secrets.yaml
  # TODO: the remaining four credentials cannot be sealed until their plaintext
  # exists. Add each here as it is created (names are frozen — strict-scope
  # SealedSecrets bind to namespace + name):
  #   - sealedsecret-db.yaml    (HRIS_ATS_DATABASE_PASSWORD — generated on the PG box)
  #   - sealedsecret-r2.yaml    (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY — dashboard token)
  #   - sealedsecret-ghcr.yaml  (.dockerconfigjson — ghcr.io read token)
  #   - sealedsecret-smtp.yaml  (SMTP_USERNAME, SMTP_PASSWORD — Fastmail app password)
  # ghcr-registry-auth belongs to flux-system (the chart pull secret), so it is
  # applied by that namespace's own workflow, not listed here.
