apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - certificate.yaml
  - ingressroute.yaml
  - ingressroute-https.yaml
  # Credentials. Every one of these is a SealedSecret: the plaintext never
  # existed in this repository, and each was piped straight into kubeseal.
  - sealedsecret-rails-secrets.yaml # RAILS_MASTER_KEY
  - sealedsecret-db.yaml            # HRIS_ATS_DATABASE_PASSWORD
  - sealedsecret-r2.yaml            # R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
  - sealedsecret-smtp.yaml          # SMTP_USERNAME, SMTP_PASSWORD
  - sealedsecret-ghcr.yaml          # .dockerconfigjson for the private image
  # The chart comes from a private GHCR package, and a HelmRepository's secretRef
  # must live in its own namespace — so this one decrypts into flux-system. Flux
  # simply retries the chart fetch until the controller has created it.
  - sealedsecret-registry-auth.yaml # .dockerconfigjson in flux-system
