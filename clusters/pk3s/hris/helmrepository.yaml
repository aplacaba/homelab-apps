apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hris-charts
  namespace: flux-system
spec:
  type: oci
  # Repository-level reconcile. For an OCI repository there is no index artifact to
  # refresh, so this is NOT what re-lists the chart's tags — that happens on the
  # HelmChart object, whose interval comes from the HelmRelease's
  # `chart.spec.interval` (verified 2026-09-13: this field went to 10m while the
  # HelmChart stayed at 1h). Left at the hourly default accordingly.
  interval: 1h
  # The app repo publishes its own chart here (see tala-hris: charts/hris).
  url: oci://ghcr.io/aplacaba/charts
  # Private GHCR package: the chart pull needs a dockerconfigjson in THIS
  # namespace (a secretRef must live next to the HelmRepository).
  secretRef:
    name: ghcr-registry-auth
