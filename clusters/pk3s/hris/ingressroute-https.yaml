apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hris-https
  namespace: hris
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hris.alacaba.org`)
      services:
        - name: hris
          port: 8080
  # The cluster's default TLSStore only covers *.watchtoken.org, so this host
  # pins its own certificate (issued below, same namespace).
  tls:
    secretName: hris-alacaba-org-tls
