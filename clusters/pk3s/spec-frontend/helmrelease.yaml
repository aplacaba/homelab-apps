apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spec-frontend
  namespace: spec-frontend
spec:
  interval: 1h
  chart:
    spec:
      chart: spec-frontend
      version: "0.2.3"
      sourceRef:
        kind: HelmRepository
        name: cv-datastar
        namespace: flux-system
  values:
    existingSecret: neo4j-creds

    image:
      repository: fgit.watchtoken.org/forgejo-admin/spec-frontend
      # Empty tag => chart renders image:.Chart.AppVersion (main-<sha> baked at
      # publish time), pinning the image built from the same commit as the chart.
      tag: ""
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: forgejo-registry-auth

    # We manage routing via Traefik IngressRoutes
    ingress:
      enabled: false

    replicaCount: 1
