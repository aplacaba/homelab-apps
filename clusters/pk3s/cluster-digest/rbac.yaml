apiVersion: v1
kind: ServiceAccount
metadata:
  name: digest-worker
  namespace: cluster-digest
---
# Read-only access to everything the worker inventories
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-digest-reader
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-digest-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-digest-reader
subjects:
  - kind: ServiceAccount
    name: digest-worker
    namespace: cluster-digest
---
# Registry pull credentials for the private charts (hris on ghcr, cv-datastar
# on fgit) — restricted to the two existing dockerconfigjson secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-digest-registry-creds
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["forgejo-registry-auth", "ghcr-registry-auth"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-digest-registry-creds
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-digest-registry-creds
subjects:
  - kind: ServiceAccount
    name: digest-worker
    namespace: cluster-digest
