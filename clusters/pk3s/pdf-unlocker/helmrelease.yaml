apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-pdf-unlocker
  namespace: pdf-unlocker
spec:
  interval: 1h
  chart:
    spec:
      chart: paperless-pdf-unlocker
      version: "0.1.x"
      sourceRef:
        kind: HelmRepository
        name: ghcr-aplacaba
        namespace: flux-system
  values:
    config:
      paperlessUrl: http://paperless-ngx.paperless-ngx.svc.cluster.local:8000
      skipSslVerify: "0"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
  valuesFrom:
    - kind: Secret
      name: paperless-pdf-unlocker-values
      valuesKey: values.yaml
