apiVersion: apps/v1
kind: Deployment
metadata:
  name: download
  namespace: media
  labels:
    app: download
spec:
  replicas: 0
  selector:
    matchLabels:
      app: download
  template:
    metadata:
      labels:
        app: download
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.128.0.1
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - secretRef:
                name: gluetun-credentials
          env:
            - name: FIREWALL
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8081,8080"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: ""
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      wget -qO- http://127.0.0.1:8000/v1/publicip/ip >/dev/null 2>&1 && exit 0
                      sleep 5
                    done
                    exit 1
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Montevideo
            - name: WEBUI_PORT
              value: "8081"
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1.5Gi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: qbittorrent-config
              mountPath: /config
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Montevideo
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 750Mi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: sabnzbd-config
              mountPath: /config
      securityContext:
        fsGroup: 1000
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: media
          hostPath:
            path: /home/new-media/Media
            type: Directory
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: sabnzbd-config
          persistentVolumeClaim:
            claimName: sabnzbd-config
