apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
  labels:
    app: bazarr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        ports:
        - containerPort: 6767
          name: http
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/Montevideo
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 512Mi
        volumeMounts:
        - name: media
          mountPath: /media
        - name: config
          mountPath: /config
      securityContext:
        fsGroup: 1000
      volumes:
      - name: media
        hostPath:
          path: /home/new-media/Media
          type: Directory
      - name: config
        persistentVolumeClaim:
          claimName: bazarr-config
