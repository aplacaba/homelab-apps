apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: media
  labels:
    app: readarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  template:
    metadata:
      labels:
        app: readarr
    spec:
      containers:
      - name: readarr
        image: lscr.io/linuxserver/readarr:develop
        ports:
        - containerPort: 8787
          name: http
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/Montevideo
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
        volumeMounts:
        - name: media
          mountPath: /data
        - name: config
          mountPath: /config
      securityContext:
        fsGroup: 1000
      volumes:
      - name: media
        hostPath:
          path: /home/new-media/Media
          type: Directory
      - name: config
        persistentVolumeClaim:
          claimName: readarr-config
