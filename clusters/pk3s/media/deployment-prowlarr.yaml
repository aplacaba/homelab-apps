apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app: prowlarr
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        ports:
        - containerPort: 9696
          name: http
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: America/Montevideo
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 512Mi
        volumeMounts:
        - name: media
          mountPath: /media
        - name: config
          mountPath: /config
      securityContext:
        fsGroup: 1000
      volumes:
      - name: media
        hostPath:
          path: /home/new-media/Media
          type: Directory
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config
