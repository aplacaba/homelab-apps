apiVersion: apps/v1
kind: Deployment
metadata:
  name: lazylibrarian
  namespace: media
  labels:
    app: lazylibrarian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lazylibrarian
  template:
    metadata:
      labels:
        app: lazylibrarian
    spec:
      containers:
        - name: lazylibrarian
          image: lscr.io/linuxserver/lazylibrarian:latest
          ports:
            - containerPort: 5299
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Montevideo
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: media
              mountPath: /data
            - name: config
              mountPath: /config
      securityContext:
        fsGroup: 1000
      volumes:
        - name: media
          hostPath:
            path: /home/new-media/Media
            type: Directory
        - name: config
          persistentVolumeClaim:
            claimName: lazylibrarian-config
