apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: windshift-setup-block-mw
  namespace: windshift
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windshift-redirect
  namespace: windshift
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`windshift.watchtoken.org`)
      middlewares:
        - name: redirect-to-https
          namespace: traefik
      services:
        - name: windshift
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windshift-websecure
  namespace: windshift
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`windshift.watchtoken.org`)
      services:
        - name: windshift
          port: 8080
  tls: {}
---
# Temporary first-run protection: /api/setup is only reachable via
# `kubectl port-forward` until the admin account is claimed. Remove this
# IngressRoute + the middleware above once setup is complete.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windshift-block-setup
  namespace: windshift
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`windshift.watchtoken.org`) && PathPrefix(`/api/setup`)
      middlewares:
        - name: windshift-setup-block-mw
      services:
        - name: windshift
          port: 8080
  tls: {}
