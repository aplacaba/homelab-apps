apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windshift-redirect
  namespace: windshift
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`windshift.watchtoken.org`)
      middlewares:
        - name: redirect-to-https
          namespace: traefik
      services:
        - name: windshift
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windshift-websecure
  namespace: windshift
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`windshift.watchtoken.org`)
      services:
        - name: windshift
          port: 8080
  tls: {}
