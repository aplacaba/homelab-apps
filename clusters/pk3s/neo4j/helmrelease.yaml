apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: neo4j
  namespace: neo4j
spec:
  interval: 1h
  chart:
    spec:
      chart: neo4j
      version: "5.26.28"
      sourceRef:
        kind: HelmRepository
        name: neo4j
        namespace: flux-system
  values:
    neo4j:
      name: neo4j
      edition: community
      passwordFromSecret: neo4j-auth
    volumes:
      data:
        mode: dynamic
        dynamic:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          requests:
            storage: 10Gi
    services:
      neo4j:
        spec:
          type: NodePort
        ports:
          http:
            enabled: false
          https:
            enabled: false
          bolt:
            enabled: true
            port: 7687
            nodePort: 30087
          backup:
            enabled: false
    nodeSelector:
      kubernetes.io/hostname: k3s-master
