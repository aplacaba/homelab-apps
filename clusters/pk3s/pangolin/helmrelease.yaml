apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: pangolin
spec:
  interval: 1h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: newt
      version: "1.6.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial
        namespace: flux-system
  values:
    newtInstances:
      - name: main-tunnel
        enabled: true
        auth:
          existingSecretName: newt-auth
        service:
          enabled: false
        # newt >= 1.13 starts a built-in SSH server by default; only HTTP
        # resources are tunnelled here, so keep it off.
        disableSSH: true
        # chart >= 1.6.0 imposes no sizing; keep the 1.4.0 defaults minus the
        # CPU limit (upstream: CPU throttling silently degrades the WireGuard path).
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            memory: 256Mi
            ephemeral-storage: 256Mi
        nodeSelector:
          kubernetes.io/hostname: k3s-master
