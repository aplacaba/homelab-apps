apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
  namespace: pangolin
spec:
  interval: 1h
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: newt
      version: "1.4.0"
      sourceRef:
        kind: HelmRepository
        name: fossorial
        namespace: flux-system
  values:
    newtInstances:
      - name: main-tunnel
        enabled: true
        auth:
          existingSecretName: newt-auth
        service:
          enabled: false
        nodeSelector:
          kubernetes.io/hostname: k3s-master
