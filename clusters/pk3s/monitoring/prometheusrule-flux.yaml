apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-alerts
  namespace: monitoring
spec:
  groups:
    - name: flux
      rules:
        - alert: KustomizationFailed
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="Kustomization"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kustomization {{ $labels.name }} failed to reconcile"
            description: "Kustomization {{ $labels.name }} in namespace {{ $labels.namespace }} has been failing for at least 5 minutes."

        - alert: HelmReleaseFailed
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind="HelmRelease"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HelmRelease {{ $labels.name }} failed to reconcile"
            description: "HelmRelease {{ $labels.name }} in namespace {{ $labels.namespace }} has been failing for at least 5 minutes."

        - alert: SourceFailed
          expr: |
            gotk_reconcile_condition{type="Ready", status="False", kind=~"GitRepository|HelmRepository|OCIRepository|Bucket"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Source {{ $labels.name }} fetch failed"
            description: "Source {{ $labels.kind }}/{{ $labels.name }} in namespace {{ $labels.namespace }} has been failing for at least 5 minutes."
