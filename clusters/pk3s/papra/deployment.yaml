apiVersion: apps/v1
kind: Deployment
metadata:
  name: papra
  namespace: papra
  labels:
    app: papra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: papra
  template:
    metadata:
      labels:
        app: papra
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: papra
          image: ghcr.io/papra-hq/papra:26.6.1-rootless
          env:
            - name: APP_BASE_URL
              value: https://papra.watchtoken.org
            - name: TRUSTED_ORIGINS
              value: http://localhost:1221
            - name: AUTH_IS_REGISTRATION_ENABLED
              value: "true"
            - name: AUTH_FIRST_USER_AS_ADMIN
              value: "true"
            - name: DOCUMENT_STORAGE_MAX_UPLOAD_SIZE
              value: "0"
            - name: INTAKE_EMAILS_IS_ENABLED
              value: "true"
            - name: INTAKE_EMAILS_DRIVER
              value: owlrelay
            - name: OWLRELAY_WEBHOOK_URL
              value: https://papra.watchtoken.org/api/intake-emails/ingest
            - name: DOCUMENTS_OCR_LANGUAGES
              value: eng
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: papra-secret
                  key: AUTH_SECRET
            - name: OWLRELAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: papra-secret
                  key: OWLRELAY_API_KEY
            - name: INTAKE_EMAILS_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: papra-secret
                  key: INTAKE_EMAILS_WEBHOOK_SECRET
          ports:
            - containerPort: 1221
              name: http
          volumeMounts:
            - name: data
              mountPath: /app/app-data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 1221
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 1221
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: papra-data
