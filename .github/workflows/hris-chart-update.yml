name: HRIS chart auto-update

# Keeps the HRIS HelmRelease pin moving while the app is still pre-1.0: every run
# asks GHCR for the newest published hris chart below 1.0.0 and, when it is newer
# than the pin in clusters/pk3s/hris/helmrelease.yaml, opens a bump PR.
#
# 1.0.0 is the freeze line — a major release is never picked up here, it gets a
# deliberate human bump (the detection script refuses candidates >= 1.0.0 and
# says so in the job summary when one appears).
#
# The script also gates on the image: it reads the candidate chart's appVersion
# from the chart layer and requires that image tag to exist in
# ghcr.io/aplacaba/tala-hris, so an auto-bump can never land a chart whose image
# is not published yet (see the HRIS ImagePullBackOff gotcha in AGENTS.md).
#
# Merging the PR is what changes the cluster: Flux picks the new pin up on its
# next sync and the pod rolls onto the new appVersion.

on:
  schedule:
    # Every 6 hours, off the hour to stay clear of the top-of-hour rush.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: hris-chart-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Detect a chart release below 1.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A PAT, not GITHUB_TOKEN: commits pushed with GITHUB_TOKEN do not
          # trigger other workflows, and this branch is pushed for review.
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Detect a newer chart below 1.0.0
        id: detect
        env:
          # Falls back to GH_PAT when no dedicated read-only token is set. Either
          # way the token needs read:packages (classic PAT) or Packages: Read
          # (fine-grained PAT) on the private aplacaba/charts package.
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GH_PAT }}
        run: ./scripts/hris-chart-update.sh

      - name: Job summary
        if: always()
        env:
          CURRENT: ${{ steps.detect.outputs.current }}
          CANDIDATE: ${{ steps.detect.outputs.candidate }}
          LATEST_BELOW: ${{ steps.detect.outputs.latest_below_ceiling }}
          LATEST_ANY: ${{ steps.detect.outputs.latest_any }}
          APP_VERSION: ${{ steps.detect.outputs.app_version }}
        run: |
          {
            echo "### HRIS chart check"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| HelmRelease pin | \`${CURRENT:-unknown}\` |"
            echo "| Newest below 1.0.0 | \`${LATEST_BELOW:-none}\` |"
            echo "| Newest published | \`${LATEST_ANY:-none}\` |"
            echo "| Image tag of candidate | \`${APP_VERSION:-n/a}\` |"
            echo
            if [[ -n "${CANDIDATE}" ]]; then
              echo "Bumping the pin to \`${CANDIDATE}\`."
            elif [[ -n "${LATEST_ANY}" && "${LATEST_ANY}" != "${LATEST_BELOW}" ]]; then
              echo "Nothing to do: 1.0.0 or newer is published, so the pre-1.0 auto-update window is closed. Bump the pin by hand."
            else
              echo "Nothing to do: the pin is already the newest chart below 1.0.0."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump the pin and open a PR
        if: steps.detect.outputs.candidate != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GH_PAT }}
          CURRENT: ${{ steps.detect.outputs.current }}
          CANDIDATE: ${{ steps.detect.outputs.candidate }}
          APP_VERSION: ${{ steps.detect.outputs.app_version }}
        run: |
          set -euo pipefail

          branch="automation/hris-chart-bump"
          title="chore(hris): bump chart ${CURRENT} → ${CANDIDATE}"
          file="clusters/pk3s/hris/helmrelease.yaml"

          # A closed PR for this exact version means the operator looked at this
          # release and declined it. Do not resurrect it on the next run.
          gh pr list --head "$branch" --state all --limit 100 \
            --json number,state,title > /tmp/prs.json
          read -r pr_number pr_state <<<"$(python3 -c '
          import json, sys
          title = sys.argv[1]
          matches = [pr for pr in json.load(open("/tmp/prs.json")) if pr["title"] == title]
          pr = matches[-1] if matches else None
          print("%d %s" % (pr["number"], pr["state"]) if pr else "0 none")
          ' "$title")"

          if [[ "$pr_state" == "CLOSED" ]]; then
            echo "PR #${pr_number} for ${CANDIDATE} was closed without merging — leaving this version alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ./scripts/hris-chart-update.sh --apply

          if git diff --quiet -- "$file"; then
            echo "The pin already points at ${CANDIDATE}; nothing to commit."
            exit 0
          fi

          git config user.name "aplacaba"
          git config user.email "aplacaba@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$file"
          git commit -m "$title"
          git push --force origin "$branch"

          {
            echo "Automated bump of the HRIS chart pin while the app is still below 1.0.0."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Chart | \`hris\` \`${CURRENT}\` → \`${CANDIDATE}\` |"
            echo "| Image tag (chart appVersion) | \`${APP_VERSION}\` |"
            echo
            echo "Checked before opening this PR:"
            echo
            echo "- the chart manifest and \`Chart.yaml\` are pullable from \`ghcr.io/aplacaba/charts/hris\`;"
            echo "- the image tag named by the chart's \`appVersion\` already exists in \`ghcr.io/aplacaba/tala-hris\`;"
            echo "- the candidate is an exact stable semver below \`1.0.0\`."
            echo
            echo "Merging is the deploy: Flux syncs the new pin on its next pass and the pod rolls onto the new image (migrations run at container start, single replica, \`strategy: Recreate\`)."
            echo
            echo "App repo: https://github.com/aplacaba/tala-hris/releases"
          } > /tmp/pr-body.md

          if [[ "$pr_state" == "OPEN" ]]; then
            gh pr edit "$pr_number" --title "$title" --body-file /tmp/pr-body.md
            echo "Updated PR #${pr_number} to ${CANDIDATE}." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --base main --head "$branch" \
              --title "$title" --body-file /tmp/pr-body.md
            echo "Opened a bump PR for ${CANDIDATE}." >> "$GITHUB_STEP_SUMMARY"
          fi
